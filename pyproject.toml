[project]
name = "phase-identifiability"
version = "0.1.0"
description = "Identifiability of phase-space coordinates via contrastive learning"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[classic-control]>=0.29",
    "matplotlib>=3.10.8",
    "numpy",
    "pygame",
    "pytest>=9.0.2",
    "scipy>=1.17.1",
    "torch",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
]

[tool.setuptools]
packages = ["phase_id"]

[tool.ruff]
line-length = 80

[tool.pytest.ini_options]
pythonpath = ["."]
